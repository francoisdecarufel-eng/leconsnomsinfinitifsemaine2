      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'success') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
          osc.frequency.exponentialRampToValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
          osc.frequency.exponentialRampToValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
          gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.35);
        } else if (type === 'error') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, audioCtx.currentTime); // A3
          osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.25);
        } else if (type === 'click') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.08);
        }
      } catch (e) {
        // Fallback silently if audio context disabled
      }
    };

    // --- MAIN COMPONENT ---
    function App() {

        setSelectedAnswer(null);
        setIsSubmitted(false);
        setIsCorrect(false);
        setShowHint(false);

      const handleTabChange = (tabId) => {
        playSound('click');
        setActiveTab(tabId);
        setCurrentQIndex(0);
        resetQuestionState();

      const getQuestionsForTab = (tab) => {
        switch (tab) {
          case 1: return TAB1_QUESTIONS;
          case 2: return TAB2_QUESTIONS;
          case 3: return TAB3_QUESTIONS;
          case 4: return TAB4_QUIZ;
          case 5: return TAB5_QUESTIONS;
          default: return TAB1_QUESTIONS;
        }
      };

      const currentQuestions = getQuestionsForTab(activeTab);
      const currentQ = currentQuestions[currentQIndex];

      const handleSelectOption = (option) => {
        if (isSubmitted) return;
        playSound('click');
        setSelectedAnswer(option);
      };

      const handleSubmitAnswer = () => {
        if (!selectedAnswer || isSubmitted) return;
        const correct = selectedAnswer === currentQ.correct;
        setIsSubmitted(true);
        setIsCorrect(correct);

        if (correct) {
          playSound('success');
          setScores(prev => ({ ...prev, [activeTab]: prev[activeTab] + 1 }));
        } else {
          playSound('error');
        }
      };

      const handleNextQuestion = () => {
        playSound('click');
        if (currentQIndex < currentQuestions.length - 1) {
          setCurrentQIndex(prev => prev + 1);
          resetQuestionState();
        } else {
          // Tab complete
          setCompletedTabs(prev => ({ ...prev, [activeTab]: true }));
        }
      };

      const handleRestartTab = () => {
        playSound('click');
        setCurrentQIndex(0);
        resetQuestionState();
        setScores(prev => ({ ...prev, [activeTab]: 0 }));
        setCompletedTabs(prev => ({ ...prev, [activeTab]: false }));

      // Helper for Sorter interactive activity in Tab 3
      const handleSortVerb = (verbIndex, category) => {
        playSound('click');
        const updated = [...sorterVerbs];
        updated[verbIndex].category = category;
        setSorterVerbs(updated);
      };

      const checkSorterAnswers = () => {
        const allCorrect = sorterVerbs.every(v => v.category === v.correctCategory);
        if (allCorrect) {
          playSound('success');
          setSorterFeedback({ success: true, message: "Bravo ! Tous les verbes sont parfaitement classés !" });

                    </h3>

                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2 mb-3">
                      {sorterVerbs.map((v, idx) => (
                        <div key={idx} className="bg-slate-50 p-2 rounded-lg border flex flex-col gap-1 text-center">
                          <span className="font-bold text-slate-800">{v.text}</span>
                          <div className="flex justify-center gap-1">
                            {['-er', '-ir', '-oir', '-re'].map(cat => (
                              <button
                                key={cat}
                                onClick={() => handleSortVerb(idx, cat)}
                                className={`px-2 py-0.5 text-xs rounded font-bold ${

                  <QuestionRunner

    // --- REUSABLE QUESTION RUNNER COMPONENT ---
    function QuestionRunner({
      currentQ,
      currentQIndex,
      totalQ,
      selectedAnswer,
      isSubmitted,
      isCorrect,
      showHint,
      setShowHint,
      onSelectOption,
      onSubmitAnswer,
      onNextQuestion,
      isQuiz = false
    }) {
      return (
        <div className="flex-1 flex flex-col justify-between bg-slate-50 p-4 sm:p-6 rounded-2xl border-2 border-slate-200">
          <div>
            {/* Header / Progress bar */}

              <span className="text-xs sm:text-sm font-extrabold text-emerald-800 uppercase tracking-wide bg-emerald-100 px-3 py-1 rounded-full border border-emerald-300">
                {isQuiz ? `Concept : ${currentQ.concept}` : `Exercice ${currentQIndex + 1} / ${totalQ}`}
              </span>
              <span className="text-xs font-bold text-slate-500">
                Avancement : {Math.round(((currentQIndex + 1) / totalQ) * 100)}%
              </span>
            </div>

            {/* Progress line */}
            <div className="w-full bg-slate-200 h-2.5 rounded-full mb-6 overflow-hidden">
              <div
                className="bg-emerald-500 h-full transition-all duration-300"
                style={{ width: `${((currentQIndex + 1) / totalQ) * 100}%` }}
              ></div>
            </div>

            {/* Question Text */}
            <h3 className="text-base sm:text-lg md:text-xl font-bold text-slate-800 mb-6 leading-snug">
              {currentQ.question}
            </h3>

            {/* Options */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
              {currentQ.options.map((option, idx) => {
                const isSelected = selectedAnswer === option;
                let btnStyle = "bg-white text-slate-800 border-slate-300 hover:border-emerald-400 hover:bg-emerald-50";

                if (isSubmitted) {
                  if (option === currentQ.correct) {
                    btnStyle = "bg-green-500 text-white border-green-600 font-bold ring-2 ring-green-300";
                  } else if (isSelected && !isCorrect) {
                    btnStyle = "bg-red-500 text-white border-red-600 font-bold";
                  } else {
                    btnStyle = "bg-slate-100 text-slate-400 border-slate-200 opacity-60";
                  }
                } else if (isSelected) {
                  btnStyle = "bg-emerald-600 text-white border-emerald-700 font-bold ring-4 ring-emerald-200";
                }

                return (
                  <button
                    key={idx}
                    onClick={() => onSelectOption(option)}
                    disabled={isSubmitted}
                    className={`p-3 sm:p-4 rounded-xl border-2 text-left text-sm sm:text-base font-semibold transition-all break-words shadow-sm ${btnStyle}`}
                  >
                    <span className="mr-2 inline-block w-6 h-6 text-center rounded-full bg-slate-200 text-slate-700 text-xs font-black leading-6">
                      {String.fromCharCode(65 + idx)}
                    </span>
                    {option}
                  </button>
                );
              })}
            </div>

            {/* Hint Section */}
            {currentQ.hint && !isSubmitted && (
              <div className="mb-4">
                {!showHint ? (
                  <button
                    onClick={() => setShowHint(true)}
                    className="text-xs sm:text-sm font-bold text-amber-700 hover:underline flex items-center gap-1"
                  >
                    <span>🟡</span> Besoins d'un indice ?
                  </button>
                ) : (
                  <div className="p-3 bg-amber-50 border border-amber-300 rounded-xl text-xs sm:text-sm text-amber-900 font-medium">
                    💡 <strong>Indice :</strong> {currentQ.hint}
                  </div>
                )}
              </div>
            )}

            {/* Feedback display */}
            {isSubmitted && (
              <div className={`p-4 rounded-2xl border-2 mb-4 animate-fade-in ${isCorrect ? 'bg-green-100 border-green-400 text-green-900' : 'bg-red-100 border-red-400 text-red-900'}`}>
                <div className="flex items-center gap-2 font-bold text-base sm:text-lg mb-1">
                  <span>{isCorrect ? '🟢 Bravo ! Excellente réponse !' : '🔴 Oups, pas tout à fait !'}</span>
                </div>
                <p className="text-xs sm:text-sm font-medium leading-relaxed">
                  {currentQ.explanation}
                </p>
              </div>
            )}
          </div>

          {/* Bottom Action Controls */}
          <div className="flex items-center justify-end gap-3 mt-4 pt-3 border-t border-slate-200">
            {!isSubmitted ? (
              <button
                onClick={onSubmitAnswer}
                disabled={!selectedAnswer}
                className={`px-6 py-3 rounded-xl font-bold text-sm sm:text-base transition-all shadow-md ${
                  selectedAnswer
                    ? 'bg-emerald-600 text-white hover:bg-emerald-700 active:scale-95'
                    : 'bg-slate-300 text-slate-500 cursor-not-allowed'
                }`}
              >
                Vérifier ma réponse
              </button>
            ) : (
              <button
                onClick={onNextQuestion}
                className="px-6 py-3 bg-emerald-600 text-white rounded-xl font-bold text-sm sm:text-base hover:bg-emerald-700 active:scale-95 shadow-md flex items-center gap-2"
              >
                <span>{currentQIndex < totalQ - 1 ? 'Question Suivante' : 'Terminer cette section'}</span>
                <span>➔</span>
              </button>
            )}
          </div>
        </div>
      );
    }

    // --- TAB COMPLETION SCREEN ---
    function TabCompletionCard({ score, total, onRestart, onNextTab, nextTabTitle, isFinal = false }) {
      const percentage = Math.round((score / total) * 100);

      return (
        <div className="flex-1 flex flex-col items-center justify-center text-center p-6 bg-emerald-50 rounded-2xl border-2 border-emerald-300">
          <div className="text-6xl mb-4 animate-bounce">
            {percentage >= 80 ? '🎉' : percentage >= 50 ? '👏' : '💪'}
          </div>

          <h2 className="text-2xl sm:text-3xl font-black text-emerald-900 mb-2">
            {isFinal ? 'Grand Quiz Terminé !' : 'Bravo, section complétée !'}
          </h2>

          <p className="text-base text-slate-700 mb-6">
            Tu as obtenu un score de <strong className="text-emerald-800 text-xl">{score} sur {total}</strong> ({percentage}%).
          </p>

          <div className="flex flex-wrap justify-center gap-4">
            <button
              onClick={onRestart}
              className="px-5 py-3 bg-white text-emerald-800 border-2 border-emerald-400 rounded-xl font-bold text-sm hover:bg-emerald-100 shadow"
            >
              🔄 Recommencer cette activité
            </button>

            {!isFinal && onNextTab && (
              <button
                onClick={onNextTab}
                className="px-6 py-3 bg-emerald-600 text-white rounded-xl font-bold text-sm hover:bg-emerald-700 shadow-lg"
              >
                Passer à : {nextTabTitle} ➔
              </button>
            )}
          </div>
        </div>
      );
    }

    // Render React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

</body>
</html>
